name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare files and install packages
        run: |
          mkdir -p www
          find . -maxdepth 3 -iname "*index*.html*" ! -path "./www/index.html" -exec cp "{}" www/index.html \;
          find . -maxdepth 3 -iname "*data*.js*" ! -path "./www/data.js" -exec cp "{}" www/data.js \;
          find . -maxdepth 3 -iname "*game*.js*" ! -path "./www/game.js" -exec cp "{}" www/game.js \;
          if [ ! -f www/index.html ]; then echo "<!DOCTYPE html><html><body><h1>Missing index.html</h1></body></html>" > www/index.html; fi
          node -e 'fs.writeFileSync("package.json", JSON.stringify({name:"country-marble-race",version:"1.0.0",dependencies:{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2","@capacitor/core":"^6.1.2","matter-js":"^0.19.0"}}, null, 2))'
          node -e 'fs.writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.marblecup.countryrace",appName:"Country Marble Race",webDir:"www"}, null, 2))'
          npm install
          cp node_modules/matter-js/build/matter.min.js www/matter.min.js

      - name: Build Android APK
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CountryMarbleRace-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
