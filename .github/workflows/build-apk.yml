name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare files, generate HD offline asset pack, and install packages
        run: |
          mkdir -p www/assets
          find . -maxdepth 3 -iname "*index*.html*" ! -path "./www/index.html" -exec cp "{}" www/index.html \;
          find . -maxdepth 3 -iname "*data*.js*" ! -path "./www/data.js" -exec cp "{}" www/data.js \;
          find . -maxdepth 3 -iname "*game*.js*" ! -path "./www/game.js" -exec cp "{}" www/game.js \;
          node -e '
            const fs = require("fs");
            fs.writeFileSync("package.json", JSON.stringify({
              name: "country-marble-race-pro",
              version: "5.0.0",
              dependencies: {
                "@capacitor/android": "^6.1.2",
                "@capacitor/cli": "^6.1.2",
                "@capacitor/core": "^6.1.2",
                "matter-js": "^0.19.0"
              }
            }, null, 2));
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.marblecup.countryrace",
              appName: "Country Marble Race Pro",
              webDir: "www"
            }, null, 2));
            // Generate offline HD uncompressed WAV ambiance & physics sound banks + lookup tables (~25MB APK pack)
            function writeWav(filename, durationSec, freqBase) {
              const sampleRate = 44100;
              const numSamples = sampleRate * durationSec;
              const buf = Buffer.alloc(44 + numSamples * 2);
              buf.write("RIFF", 0);
              buf.writeUInt32LE(36 + numSamples * 2, 4);
              buf.write("WAVEfmt ", 8);
              buf.writeUInt32LE(16, 16);
              buf.writeUInt16LE(1, 20);
              buf.writeUInt16LE(1, 22);
              buf.writeUInt32LE(sampleRate, 24);
              buf.writeUInt32LE(sampleRate * 2, 28);
              buf.writeUInt16LE(2, 32);
              buf.writeUInt16LE(16, 34);
              buf.write("data", 36);
              buf.writeUInt32LE(numSamples * 2, 40);
              for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate;
                const env = Math.sin(Math.PI * (i / numSamples));
                const val = Math.sin(2 * Math.PI * freqBase * t) * 0.35 + Math.sin(2 * Math.PI * (freqBase * 1.5) * t) * 0.2;
                buf.writeInt16LE(Math.max(-32767, Math.min(32767, Math.floor(val * env * 12000))), 44 + i * 2);
              }
              fs.writeFileSync(filename, buf);
            }
            writeWav("www/assets/stadium_theme_1.wav", 65, 110);
            writeWav("www/assets/stadium_theme_2.wav", 65, 146.83);
            writeWav("www/assets/stadium_theme_3.wav", 65, 164.81);
            writeWav("www/assets/crowd_roar_hd.wav", 45, 98.0);
          '
          npm install
          cp node_modules/matter-js/build/matter.min.js www/matter.min.js

      - name: Build Android APK Locked to Landscape Mode
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/g' android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CountryMarbleRace-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
